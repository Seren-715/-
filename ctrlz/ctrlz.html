/* =====================================================================
   Ctrl+Z - Never deploy on Friday.   19 s / 16:9 / 60 fps / seamless loop
   One HTML file, three.js 0.160.0. Every frame is a pure function of t:
       window.renderAt(t, samples)      seeded random only
   URL: ?render=1 (no playback) &w= &h= &t= (still) &samples=
   ===================================================================== */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

await Promise.all(['700 64px "CZ Inter"', '600 64px "CZ Inter"', '700 64px "CZ Mono"'].map(f => document.fonts.load(f)));
const FONT = '"CZ Inter", Inter, Helvetica, Arial, sans-serif', MONO = '"CZ Mono", "JetBrains Mono", Menlo, monospace';

const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const W = +(Q.get('w') || (RENDER ? 1920 : 1280));
const H = +(Q.get('h') || (RENDER ? 1080 : 720));
const DUR = 19, FPS = 60, NF = DUR * FPS;

/* ---------- math helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const sm5 = x => { x = clamp(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const wrapT = t => ((t % DUR) + DUR) % DUR;
const arc = u => 4 * u * (1 - u);
/** damped spring response to a unit kick at d=0: starts at 1, oscillates, decays */
const spring = (d, f = 5, z = 0.3) => d < 0 ? 0 : Math.exp(-z * TAU * f * d) * Math.cos(TAU * f * Math.sqrt(1 - z * z) * d);
/** same, but starts at 0 (velocity kick) */
const kick = (d, f = 5, z = 0.3) => d < 0 ? 0 : Math.exp(-z * TAU * f * d) * Math.sin(TAU * f * Math.sqrt(1 - z * z) * d);
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const halton = (i, b) => { let f = 1, r = 0; i++; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);

const HEX = n => '#' + n.toString(16).padStart(6, '0');

/* =====================================================================
   KEYBOARD: 60%, 61 keys, 1u = 1 world unit (19.05 mm). Sculpted rows.
   ===================================================================== */
const ROWS = [
  ['Esc', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', ['Bksp', 2]],
  [['Tab', 1.5], 'Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', '[', ']', ['\\', 1.5]],
  [['Caps', 1.75], 'A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';', "'", ['Enter', 2.25]],
  [['LShift', 2.25], 'Z', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '/', ['RShift', 2.75]],
  [['LCtrl', 1.25], ['LWin', 1.25], ['LAlt', 1.25], ['Space', 6.25], ['RAlt', 1.25], ['RWin', 1.25], ['Menu', 1.25], ['RCtrl', 1.25]],
];
const DUAL = { '1': '!', '2': '@', '3': '#', '4': '$', '5': '%', '6': '^', '7': '&', '8': '*', '9': '(', '0': ')', '-': '_', '=': '+', '[': '{', ']': '}', '\\': '|', ';': ':', "'": '"', ',': '<', '.': '>', '/': '?' };
const MODL = { Esc: 'Esc', Bksp: 'Backspace', Tab: 'Tab', Caps: 'Caps Lock', Enter: 'Enter', LShift: 'Shift', RShift: 'Shift', LCtrl: 'Ctrl', RCtrl: 'Ctrl', LWin: 'Win', RWin: 'Win', LAlt: 'Alt', RAlt: 'Alt', Menu: 'Menu', Space: '' };
const ACCENT = new Set(['Esc', 'Enter', 'LCtrl', 'Z']);
/* row profile (OEM-like): cap height and top tilt (deg, + = front edge lower, faces the typist) */
const PROFILE = [{ h: 0.62, tilt: 8 }, { h: 0.55, tilt: 4 }, { h: 0.50, tilt: 0 }, { h: 0.52, tilt: -4 }, { h: 0.52, tilt: -7 }];
const PLATE_Y = 0.30, CAP_BOTTOM = 0.54, MAX_TRAVEL = 0.21;
const GAP = 0.07, SKIRT_D = 0.93, INSET_W = 0.135, INSET_D = 0.15, TOP_ZOFF = -0.025;

const KEYS = [], K = {};
ROWS.forEach((row, r) => {
  let x = -7.5;
  row.forEach(def => {
    const [id, w] = Array.isArray(def) ? def : [def, 1];
    const pr = PROFILE[r];
    const k = { id, w, row: r, x: x + w / 2, z: (r - 2) * 1.0, index: KEYS.length,
      alpha: !(id in MODL), accent: ACCENT.has(id), h: pr.h, tilt: pr.tilt * Math.PI / 180,
      hwB: (w - GAP) / 2, hdB: SKIRT_D / 2 };
    k.hwT = k.hwB - INSET_W; k.hdT = k.hdB - INSET_D; k.dish = id === 'Space' ? -0.012 : 0.026;
    KEYS.push(k); K[id] = k; x += w;
  });
});
/** local top height of a cap (relative to its bottom), at local x/z (unpressed) */
const capTopLocal = (k, lx, lz) => k.h - k.dish * Math.max(0, 1 - (lx / k.hwT) ** 2) - Math.tan(k.tilt) * (lz - TOP_ZOFF);
/** key whose skirt footprint contains world x,z (or null = gap / off board) */
function keyAt(x, z) {
  for (const k of KEYS) if (Math.abs(x - k.x) <= k.hwB && Math.abs(z - k.z) <= k.hdB) return k;
  return null;
}
/** is world x,z on the usable top surface of key k (inset margin m) */
const onTop = (k, x, z, m = 0.04) => Math.abs(x - k.x) <= k.hwT - m && Math.abs(z - k.z - TOP_ZOFF) <= k.hdT - m;
/** rest top world height at x,z (if on a key) */
const restTopAt = (x, z) => { const k = keyAt(x, z); return k ? CAP_BOTTOM + capTopLocal(k, x - k.x, z - k.z) : CAP_BOTTOM + 0.5; };

/* =====================================================================
   CLOCKS + HERO CHOREOGRAPHY  (pure functions of time)
   story clock s : 2.17 .. 11.7 (rewind #2 runs it backwards to 5.55)
   P clock       : 13.0 .. 17.85 (relief, tiptoe, dust mote, sneeze, blown back)
   explosion tau : solved ballistic clock, 17.85 -> 19 == 0 -> 1.15, freeze, rewind #1
   ===================================================================== */
const TAU_A = 0.08, TAU_B = 0.62, TAU_C = 0.40;
const tauU = u => TAU_A * u + TAU_B * (1 - Math.exp(-u / TAU_C));
const TAU_M = tauU(2.3);
const S_RW_END = 5.55;
function timeMap(t) {
  t = wrapT(t);
  if (t < 1.15) return { mode: 'expl', tau: tauU(t + 1.15) };
  if (t < 1.35) return { mode: 'expl', tau: TAU_M, freeze: (t - 1.15) / 0.2 };
  if (t < 2.06) return { mode: 'expl', tau: TAU_M * (1 - sstep(1.35, 2.06, t)), rw: 1 };
  if (t < 2.17) return { mode: 'expl', tau: 0, settle: sstep(2.06, 2.17, t) };
  if (t < 11.7) return { mode: 'story', s: t };
  if (t < 11.8) return { mode: 'story', s: 11.7 };
  if (t < 13.0) return { mode: 'story', s: 11.7 - (11.7 - S_RW_END) * sstep(11.8, 13.0, t), rw: 2 };
  if (t < 17.85) return { mode: 'p2', s: t };
  return { mode: 'expl', tau: tauU(t - 17.85) };
}

/* ---------- hero dimensions (12 x 8 x 6) ---------- */
const HA = 0.95, HB = 0.635, HC = 0.475, LEG_REST = 0.46;
const FEET = [[-0.5, -0.21], [0.5, -0.21], [-0.5, 0.21], [0.5, 0.21]];   // body-coord x,z  (0,2 = left/back pair in stretch)
const pose0 = () => ({ nubRS: 1, x: 0, z: 0, y: null, yaw: 0, pitch: 0, roll: 0, sy: 1, st: 1, anchorX: 0, bulge: 0, shearX: 0, shearZ: 0, twist: 0,
  nubL: 0.3, nubR: 0.3, splay: 0, reach: 0, ls: 1, stride: 0, strideA: 0, tuck: 0, planted: [1, 1, 1, 1], impact: 0.3,
  face: { name: 'neutral', look: [0, 0], sweat: 0 } });
/** world x,z of a foot for a pose (ignores pitch/roll; good for contact lookup) */
function footXZ(p, i) {
  const lx = (FEET[i][0] - p.anchorX) * p.st, lz = FEET[i][1];
  const c = Math.cos(p.yaw), s = Math.sin(p.yaw);
  return [p.x + lx * c + lz * s, p.z - lx * s + lz * c];
}
const groundAt = (cx, cz, yaw = 0) => { const p = pose0(); p.x = cx; p.z = cz; p.yaw = yaw; let y = 0; for (let i = 0; i < 4; i++) { const [x, z] = footXZ(p, i); y += restTopAt(x, z); } return y / 4; };

/* ---------- hop helper ---------- */
function hopPose(p, hp, s) {
  const [ax, az] = hp.A, [bx, bz] = hp.B;
  if (s < hp.t0) {                                            // anticipation crouch
    const c = sstep(hp.t0 - hp.crouch, hp.t0, s);
    p.x = ax; p.z = az; p.sy = 1 - hp.cd * c; p.bulge = 0.12 * c; p.nubL = p.nubR = 0.3 - 0.25 * c; p.yaw = hp.yawA ?? 0;
    p.shearX = -0.06 * c * Math.sign(bx - ax);
  } else if (s < hp.t1) {                                     // airborne
    const u = (s - hp.t0) / (hp.t1 - hp.t0), e = hp.ease ? hp.ease(u) : u;
    p.x = lerp(ax, bx, e); p.z = lerp(az, bz, e);
    p.y = lerp(groundAt(ax, az), groundAt(bx, bz), e) + hp.h * arc(u);
    p.planted = [0, 0, 0, 0];
    p.sy = 1 + 0.16 * Math.sin(Math.PI * u) - 0.05 * u; p.bulge = -0.05 * Math.sin(Math.PI * u);
    p.nubL = p.nubR = 0.4 + 1.1 * Math.sin(Math.PI * Math.min(1, u * 1.3)); p.tuck = Math.sin(Math.PI * u);
    p.yaw = lerp(hp.yawA ?? 0, hp.yawB ?? 0, e) - 0.22 * Math.sign(bx - ax) * Math.sin(Math.PI * u);
    p.pitch = -0.1 * Math.sin(TAU * u) * Math.sign(bz - az || 1);
    p.shearX = 0.08 * Math.cos(Math.PI * u) * Math.sign(bx - ax);
  } else {                                                    // landing squash + jiggle
    const d = s - hp.t1; p.x = bx; p.z = bz; p.yaw = hp.yawB ?? 0;
    const j = spring(d, 6, 0.28);
    p.sy = 1 - hp.land * j; p.bulge = 0.28 * hp.land * Math.max(0, j);
    p.nubL = p.nubR = 0.3 + 0.9 * kick(d, 4, 0.3); p.shearX = 0.05 * kick(d, 5, 0.3) * Math.sign(bx - ax);
    p.impact = hp.impact ?? 0.4;
  }
  return p;
}

/* ---------- STORY (s clock) ---------- */
const ST = { enter: [6.375, 0], semi: [4.25, 0], ctrlStance: [-6.375, 2] };
const HOP_T = [[3.25, 0], [1.25, 0], [-0.75, 0], [-1.75, 0], [0.0, -1], [1.25, 0], [2.25, 0], [3.0, -1], [2.25, 0], [4.25, 0]];
const HOPS = [];
{
  let prev = ST.enter;
  HOP_T.forEach((B, i) => {
    const t0 = 2.25 + 0.3 * i, d = Math.hypot(B[0] - prev[0], B[1] - prev[1]);
    HOPS.push({ A: prev, B, t0, t1: t0 + 0.22, h: 0.55 + 0.16 * d, crouch: 0.09, cd: 0.16, land: 0.2, impact: 0.45 }); prev = B;
  });
}
const BIG = { A: ST.semi, B: ST.enter, t0: 5.96, t1: 6.28, h: 1.0, crouch: 0.26, cd: 0.36, land: 0.36, impact: 1.0 };
const DODGE = [
  { A: ST.enter, B: ST.enter, t0: 6.66, t1: 6.9, h: 0.55, crouch: 0.05, cd: 0.1, land: 0.25, impact: 0.5 },
  { A: ST.enter, B: [5.95, 0], t0: 7.32, t1: 7.54, h: 0.45, crouch: 0.07, cd: 0.14, land: 0.22, impact: 0.45 },
  { A: [5.95, 0], B: [6.75, 0], t0: 7.78, t1: 8.0, h: 0.5, crouch: 0.07, cd: 0.14, land: 0.22, impact: 0.45 },
  { A: [6.75, 0], B: ST.enter, t0: 8.2, t1: 8.4, h: 0.38, crouch: 0.07, cd: 0.12, land: 0.2, impact: 0.4 },
];
const DASH = { t0: 8.93, leap: 9.18, t1: 9.85, mid: [1.5, 2], steps: 7 };
const STR = { t0: 10.2, full: 10.9, tapDown: 11.12, tap: 11.22, release: 11.35, t1: 11.69, ang: Math.atan2(-(K.Z.z - K.LCtrl.z), K.Z.x - K.LCtrl.x), st: 1.45 };

const blinkAt = t => BLINKS.some(b => t >= b && t < b + 0.11);

function heroStory(s) {
  const p = pose0(), f = p.face;
  if (s < HOPS[0].t0 - HOPS[0].crouch) { p.x = ST.enter[0]; p.z = ST.enter[1]; f.name = 'happy'; p.sy = 1 + 0.02 * Math.sin(s * 9); return p; }
  if (s < 6.28 + 0.32) {
    f.name = s < 5.7 ? 'hum' : 'happy';
    const all = [...HOPS, BIG];
    let hp = all[0];
    for (const h of all) if (s >= h.t0 - h.crouch) hp = h;
    hopPose(p, hp, s);
    if (hp === HOPS[9] && s > hp.t1) {                       // wiggle, then the big squash
      const d = s - hp.t1; p.roll = 0.13 * Math.sin(d * 30) * Math.exp(-d * 5.5); p.shearX = 0.06 * Math.sin(d * 30 + 1) * Math.exp(-d * 5.5);
      f.name = 'hum'; if (s > 4.6 && s < 4.9) f.name = 'happy';

    if (hp === BIG && s >= BIG.t1) { const d = s - BIG.t1; p.nubL = p.nubR = 1.5 * sstep(0, 0.12, d); f.name = 'tada'; }

    let hp = null; for (const h of DODGE) if (s >= h.t0 - h.crouch) hp = h;
    if (hp) hopPose(p, hp, s); else { p.x = ST.enter[0]; p.z = 0; }
    const d = s - 6.6;
    f.name = d < 0.06 ? 'tada' : (d < 0.6 ? 'shock' : 'panic'); f.sweat = sstep(6.75, 7.0, s);
    f.look = [Math.sin(s * 7.3) * 0.9, -0.15 + 0.2 * Math.sin(s * 5.1)];
    p.nubL = Math.max(p.nubL, 1.3 + 0.35 * Math.sin(s * 23)); p.nubR = Math.max(p.nubR, 1.3 + 0.35 * Math.cos(s * 21));
    if (!hp || s > hp.t1 + 0.25) { p.sy = 1 + 0.045 * Math.sin(s * 31); p.shearX = 0.05 * Math.sin(s * 17); }
    p.twist = 0.3 * Math.sin(s * 4.7) * sstep(6.7, 7.0, s);
    return p;
  }
  if (s < DASH.t0) {                                          // look left, gather
    const c = sstep(8.7, DASH.t0, s); p.x = ST.enter[0]; p.z = 0;
    f.name = 'determined'; f.look = [-1, 0]; f.sweat = 0.7; p.sy = 1 - 0.24 * c; p.bulge = 0.1 * c; p.twist = -0.35 * c; p.shearX = 0.08 * c; p.nubL = p.nubR = 0.6 - 0.4 * c;
    return p;
  }
  if (s < DASH.leap) {                                        // leap down onto the space bar
    hopPose(p, { A: ST.enter, B: DASH.mid, t0: DASH.t0, t1: DASH.leap, h: 0.9, crouch: 0.01, cd: 0, land: 0, yawA: 0, yawB: -0.3, ease: x => x }, s); p.twist = -0.35 * (1 - (s - DASH.t0) / (DASH.leap - DASH.t0));
    f.name = 'determined'; f.look = [-1, 0]; p.nubL = 0.9; p.nubR = 0.2; return p;
  }
  if (s < DASH.t1 + 0.12) {                                   // run along Space, Alt, Win to Ctrl
    const u = clamp((s - DASH.leap) / (DASH.t1 - DASH.leap)), e = 1 - Math.pow(1 - u, 1.6);
    p.x = lerp(DASH.mid[0], ST.ctrlStance[0], e); p.z = 2;

    p.sy = 0.94 + 0.08 * b; p.stride = ph * Math.PI; p.strideA = 0.9 * (1 - sstep(0.9, 1, u)); p.nubL = 0.2 + 0.8 * Math.abs(Math.sin(ph * Math.PI)); p.nubR = 0.2 + 0.8 * Math.abs(Math.cos(ph * Math.PI));

  p.anchorX = -0.5; p.x = K.LCtrl.x; p.z = K.LCtrl.z; f.name = 'determined'; f.look = [0.9, 0.1];
  if (s < STR.t0) {
    const d = s - (DASH.t1 + 0.12), lift = sstep(DASH.t1 + 0.14, DASH.t1 + 0.24, s), r = sstep(DASH.t1 + 0.24, STR.t0, s);
    p.yaw = STR.ang * r; p.planted = lift > 0.5 ? [1, 0, 1, 0] : [1, 1, 1, 1]; p.sy = 1 - 0.1 * spring(d, 5, 0.3); p.nubR = 0.3 + 0.5 * r;

    const down = sstep(STR.tapDown, STR.tap, s) * (1 - sstep(STR.tap + 0.03, STR.release, s));
    p.nubR = lerp(0.95 * g + 0.3 * (1 - g), -1.25, down); p.nubRS = 1 + 2.1 * down;   // the nub stretches like taffy down to Z p.nubL = 0.25 + 0.5 * g;
    f.name = s < STR.tap ? 'strain' : 'triumph'; f.sweat = s < STR.tap ? sstep(STR.t0, STR.t0 + 0.3, s) : 1 - sstep(STR.tap, STR.release, s);

/* ---------- P clock: relief, tiptoe, smug, dust mote, ah... ah... ACHOO, blown back ---------- */
const P2 = { stepA: [13.82, 14.32], stepB: [14.46, 14.96], m1: [5.0, -1], m2: [6.0, -1], achoo: 17.30, blow: [17.42, 17.80] };

  if (t < 16.45) {
    const u = sstep(15.2, 16.45, t);
    return { k: 'drift', u, a: sstep(15.2, 15.45, t), from: V3(8.8, 4.6, 1.2), wob: V3(0.55 * Math.sin(t * 2.3) * (1 - u), 0.18 * Math.sin(t * 3.1) * (1 - u), 0.35 * Math.sin(t * 1.7) * (1 - u)), nose };
  }

function heroP2(t) {

    f.name = t < 13.08 ? 'happy' : 'relief'; f.sweat = sstep(13.06, 13.16, t) * (1 - sstep(13.5, 13.62, t));
    const w = sstep(13.22, 13.32, t) * (1 - sstep(13.6, 13.74, t));
    p.nubR = 0.3 + w * (1.25 + 0.35 * Math.sin((t - 13.22) * 22)); p.sy = 1 + 0.03 * Math.sin((t - 13.0) * 6) - 0.04 * sstep(13.1, 13.3, t) * (1 - sstep(13.3, 13.7, t));
    p.roll = 0.04 * Math.sin((t - 13) * 5);

  if (t < P2.blow[0]) {
    f.name = t < 16.4 ? 'lookup' : 'cross';
    let back = 0;
    if (t > 16.5) back = 0.13 * sstep(16.5, 16.62, t) + 0.15 * sstep(16.9, 17.02, t) + 0.05 * sstep(17.1, 17.28, t);
    if (t > 16.5) f.name = t < 16.9 ? 'ah1' : 'ah2';
    p.pitch = -0.35 * back; p.shearZ = -0.9 * back; p.sy = 1 + 0.35 * back; p.nubL = p.nubR = 0.3 + 1.5 * back;

  // underglow only: everything else black (keeps occlusion), glowing meshes drawn on top
  const bg = scene.background; scene.background = null;   // a Color background force-clears depth on every render(): would un-occlude the LEDs NO_GLOW_PASS.forEach(o => { o.userData.v = o.visible; o.visible = false; });
  renderer.setRenderTarget(rtGlow); renderer.setClearColor(0, 1); renderer.clear();
  scene.overrideMaterial = blackMat; renderer.render(scene, camera); scene.overrideMaterial = null;
  renderer.autoClear = false; camera.layers.set(1); renderer.render(scene, camera); camera.layers.set(0); renderer.autoClear = true;
  NO_GLOW_PASS.forEach(o => o.visible = o.userData.v); scene.background = bg;
  let src = rtGlow.texture;
  LEVELS.forEach(([a, b], i) => {
    blurMat.uniforms.tMap.value = src; blurMat.uniforms.uDir.value.set(1 / a.width, 0); renderer.setRenderTarget(a); renderer.render(blurScene, quadCam);
    blurMat.uniforms.tMap.value = a.texture; blurMat.uniforms.uDir.value.set(0, 1 / a.height); renderer.setRenderTarget(b); renderer.render(blurScene, quadCam);
    src = b.texture; postMat.uniforms['tG' + i].value = b.texture;
  });
}
function placeCamera(cam, i, samples) {
  camera.fov = cam.fov; camera.aspect = W / H; camera.updateProjectionMatrix();
  const fwd = cam.tg.clone().sub(cam.p).normalize(), rt = fwd.clone().cross(UP).normalize(), up = rt.clone().cross(fwd);
  const a = halton(i, 5) * TAU, r = samples > 1 ? Math.sqrt(halton(i, 7)) * APERTURE : 0;
  camera.position.copy(cam.p).addScaledVector(rt, Math.cos(a) * r).addScaledVector(up, Math.sin(a) * r);
  camera.lookAt(cam.p.clone().addScaledVector(fwd, cam.focus));
  if (samples > 1) camera.setViewOffset(W, H, halton(i, 3) - 0.5, halton(i, 11) - 0.5, W, H); else camera.clearViewOffset();
}
window.renderAt = function (t, samples = 1) {
  t = wrapT(t);
  const osd = updateTextures(t), frame = Math.round(t * FPS);
  // glow (once per frame, centre of the shutter)
  applyScene(t); placeCamera(camAt(t), 0, 1); spot.position.copy(LAMP.bulb); renderGlow(t);
  renderer.setRenderTarget(rtAcc); renderer.setClearColor(0, 1); renderer.clear(); renderer.autoClear = false;
  for (let i = 0; i < samples; i++) {
    const ts = samples > 1 ? t + (halton(i, 2) - 0.5) * SHUTTER : t;
    applyScene(ts); placeCamera(camAt(ts), i, samples);
    const la = halton(i, 13) * TAU, lr = samples > 1 ? Math.sqrt(halton(i, 17)) * LAMP.r : 0;
    spot.position.copy(LAMP.bulb).add(V3(Math.cos(la) * lr, Math.sin(la) * lr * 0.6, Math.sin(la) * lr * 0.8)); spot.target.updateMatrixWorld();
    renderer.setRenderTarget(rtScene); renderer.autoClear = true; renderer.render(scene, camera); renderer.autoClear = false;
    renderer.setRenderTarget(rtAcc); accMat.uniforms.tMap.value = rtScene.texture; accMat.uniforms.uW.value = 1 / samples; renderer.render(accScene, quadCam);
  }
  renderer.autoClear = true; renderer.setRenderTarget(null);
  const pu = postMat.uniforms; pu.uVhs.value = vhsAmount(t); pu.uOsd.value = osd; pu.uT.value = t; pu.uFrame.value = frame;
  renderer.render(postScene, quadCam);
  return frame;
};

/* =====================================================================
   CHECKS: measure, don't guess.  window.runChecks({sub}) walks every frame
   (sub-sampled) and reports contacts, feet off keys, the nub tap, monitor
   text covered/cropped, OSD over the monitor text, and the loop seam.
   ===================================================================== */
function rectNDC(pts) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, behind = false; for (const p of pts) { const v = p.clone().project(camera); if (v.z > 1) behind = true; x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); } return { x0, y0, x1, y1, behind }; }
const ovl = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
const area = a => Math.max(0, a.x1 - a.x0) * Math.max(0, a.y1 - a.y0);
function monRectWorld(r) { const pts = []; for (const [px, py] of [[r.x0, r.y0], [r.x1, r.y0], [r.x0, r.y1], [r.x1, r.y1]]) pts.push(V3((px / 2048 - 0.5) * MON.w, (0.5 - py / 1152) * MON.h, 0.24).add(MON.pos)); return pts; }
function obbCorners(o) { const out = []; for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) out.push(o.c.clone().addScaledVector(o.a[0], sx * o.e[0]).addScaledVector(o.a[1], sy * o.e[1]).addScaledVector(o.a[2], sz * o.e[2])); return out; }
function ranges(ts, gap = 0.05) { const out = []; for (const t of ts) { const l = out[out.length - 1]; if (l && t - l[1] <= gap) l[1] = t; else out.push([t, t]); } return out.map(([a, b]) => a === b ? +a.toFixed(3) : `${a.toFixed(2)}-${b.toFixed(2)}`); }
window.runChecks = function (opt = {}) {
  const sub = opt.sub || 4, R = { capCap: [], capHero: [], capStatic: [], feetOff: [], textHero: [], textOSD: [], textCrop: [], worst: {} };
  drawMonitor(monTex.g, 3.0); const textRects = [MON_TEXT.fri, MON_TEXT.prompt].map(r => ({ ...r }));
  const bump = (k, t, v) => { if (!R.worst[k] || v > R.worst[k][1]) R.worst[k] = [+t.toFixed(3), +v.toFixed(4)]; };
  for (let f = 0; f < NF; f++) for (let j = 0; j < sub; j++) {
    const t = (f + j / sub) / FPS, S = solveHero(t), HO = heroOBBs(S);
    const caps = KEYS.map(k => { const { c, q } = capPose(k, t); return capOBB(k, c, q); });
    let cc = false, ch = false, cs = false;
    for (let a = 0; a < caps.length; a++) {
      for (let b = a + 1; b < caps.length; b++) if (obbOverlap(caps[a], caps[b], -0.003)) { cc = true; bump('capCap', t, 1); }
      // legs: tolerance = dish depth (the cap box is flat on top, the real top is dished)
      if (HO.some((B, bi) => B.standsOn !== KEYS[a] && obbOverlap(caps[a], B, bi === 0 ? -0.004 : -0.03))) { ch = true; (R.chWho ??= {})[KEYS[a].id] = (R.chWho[KEYS[a].id] || 0) + 1; }
      for (const B of STATIC_OBB) if (obbOverlap(caps[a], B, -0.003)) cs = true;
    }
    if (cc) R.capCap.push(t); if (ch) R.capHero.push(t); if (cs) R.capStatic.push(t);
    // feet on keycaps
    for (const i of S.planted) {
      const a = S.attach[i].clone().applyQuaternion(S.q).add(S.pos), dn = V3(0, -1, 0).applyQuaternion(S.q), fpos = a.addScaledVector(dn, S.legLen[i]);
      const k = keyAt(fpos.x, fpos.z);
      if (!k || !onTop(k, fpos.x, fpos.z, 0.03)) { R.feetOff.push(t); break; }
    }
    // text vs hero / OSD / crop (once per frame)
    if (j === 0) {
      placeCamera(camAt(t), 0, 1); camera.updateMatrixWorld();
      const hr = rectNDC(HO.flatMap(obbCorners));
      const ot = osdText(t), osd = { x0: OSD_RECT.x0 / 960 - 1, x1: OSD_RECT.x1 / 960 - 1, y0: 1 - OSD_RECT.y1 / 540, y1: 1 - OSD_RECT.y0 / 540 };
      for (const r of textRects) {
        const tr = rectNDC(monRectWorld(r)); if (tr.behind) continue;
        const inF = { x0: Math.max(tr.x0, -1), x1: Math.min(tr.x1, 1), y0: Math.max(tr.y0, -1), y1: Math.min(tr.y1, 1) };
        const vis = area(inF) / Math.max(1e-9, area(tr));
        if (vis > 0.02 && vis < 0.98) R.textCrop.push(t);
        if (vis > 0.02 && ovl(hr, tr) / area(tr) > 0.03) { R.textHero.push(t); bump('textHero', t, ovl(hr, tr) / area(tr)); }
        if (ot && ovl(osd, tr) > 0) R.textOSD.push(t);
      }
    }
  }
  // the nub really taps Z
  const SZ = solveHero(STR.tap), tip = nubTipWorld(SZ), zTop = CAP_BOTTOM + capTopLocal(K.Z, 0, 0) - depth('Z', STR.tap);
  R.nubTap = { tipY_minus_Ztop: +(tip.y - zTop).toFixed(3), dx: +(tip.x - K.Z.x).toFixed(3), dz: +(tip.z - K.Z.z).toFixed(3) };
  // loop seam: pose and velocity
  const h = 1 / 240; let dp = 0, dv = 0, vmax = 0;
  const pts = t => [solveHero(t).pos, ...KEYS.map(k => capPose(k, t).c)];
  const a0 = pts(0), aE = pts(DUR - 1e-6), aH = pts(h), aEh = pts(DUR - h);
  for (let i = 0; i < a0.length; i++) { dp = Math.max(dp, a0[i].distanceTo(aE[i])); const v0 = aH[i].clone().sub(a0[i]).divideScalar(h), v1 = aE[i].clone().sub(aEh[i]).divideScalar(h); dv = Math.max(dv, v0.distanceTo(v1)); vmax = Math.max(vmax, v0.length()); }
  R.seam = { maxPosStep: +dp.toExponential(2), maxVelDelta: +dv.toFixed(4), typicalSpeed: +vmax.toFixed(3) };
  const out = { samples: NF * sub };
  for (const k of ['capCap', 'capHero', 'capStatic', 'feetOff', 'textHero', 'textOSD', 'textCrop']) out[k] = { count: R[k].length, at: ranges(R[k]).slice(0, 14) };
  out.nubTap = R.nubTap; out.capHeroWho = R.chWho; out.seam = R.seam; out.worst = R.worst; out.explBadSamples = TIMELINE.stats.explBad; out.pops = TIMELINE.stats.pops;
  return out;
};
window.__DBG2 = { camAt, placeCamera, camera, monRectWorld, rectNDC, MON_TEXT, drawMonitor, monTex, solveHero, heroOBBs, keyAt, onTop, V3 };

/* =====================================================================
   PREVIEW PLAYER  ([space] pause, [<][>] step a frame, [R] restart)
   ===================================================================== */
window.__ready = true;
const hud = document.getElementById('hud');
if (Q.has('t')) window.renderAt(+Q.get('t'), +(Q.get('samples') || 1));
else if (!RENDER) {
  let t0 = performance.now(), paused = false, tp = 0;
  addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - tp * 1000; }
    if (e.code === 'ArrowRight') { tp = wrapT(tp + 1 / FPS); paused = true; }
    if (e.code === 'ArrowLeft') { tp = wrapT(tp - 1 / FPS); paused = true; }
    if (e.code === 'KeyR') { t0 = performance.now(); paused = false; }
  });
  (function loop() {
    const t = paused ? tp : wrapT((performance.now() - t0) / 1000); tp = t;
    window.renderAt(t, 1); hud.textContent = `t ${t.toFixed(2)} s  f ${Math.round(t * FPS)}   [space] pause  [<][>] frame  [R] restart`;
    requestAnimationFrame(loop);
  })();
}

</script>
